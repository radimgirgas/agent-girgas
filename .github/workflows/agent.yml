name: Agent Girgas

on:
  schedule:
    # Každých 15 minut. Časy jsou v UTC.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pouze vypsat souhrny, neodesílat maily"
        type: boolean
        default: false

concurrency:
  group: email-agent
  cancel-in-progress: false

jobs:
  process-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          IMAP_HOST: imap.seznam.cz
          SMTP_HOST: smtp.seznam.cz
          SMTP_PORT: "465"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MAX_PER_RUN: "20"
        run: python agent.py
